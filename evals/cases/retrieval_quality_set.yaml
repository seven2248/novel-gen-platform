          chapter_introduced: 1
        - id: hook-2
          type: romance
          status: open
          description: 李明与小芳的情愫
          chapter_introduced: 2
      chapters:
        - chapter_id: ch-1
          chapter_number: 1
          summary: "第1章：李明进入青云宗，遇见王师兄。"
          word_count: 1200
