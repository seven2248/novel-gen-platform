MP|name: retrieval_quality_set
JQ|description: Phase B retrieval quality evaluation — 5 cases covering character/hook/information retention
TX|cases:
  - id: retrieval_ch3_character_status_retention
    description: Chapter 3 generating — character's death in ch2 should be reflected in ch3 summary
    story_state:
      title: 测试小说
      genre: 玄幻
      style: 古典
      characters:
        - id: char-1
          name: 李明
          status: alive
          location: 青云宗
          chapter_introduced: 1
        - id: char-2
          name: 王师兄
          status: dead
          location: 青云宗
          chapter_introduced: 1
      hooks:
        - id: hook-1
          type: foreshadow
          status: open
          description: 神秘古剑的秘密
          chapter_introduced: 1
      chapters:
        - chapter_id: ch-1
          chapter_number: 1
          summary: "第1章：李明进入青云宗，遇见王师兄。王师兄带他熟悉山门。"
          word_count: 1200
          state: committed
        - chapter_id: ch-2
          chapter_number: 2
          summary: "第2章：王师兄在宗门试炼中意外身亡，李明悲痛万分，发誓要查明真相。"
          word_count: 1500
          state: committed
      plot_markers: []
    chapter_goal: 生成第3章：李明在师父指导下开始修炼
    chapter_num: 3
    chapter_id: ch-3
    checks:
      character_retention: true
      hook_tracking: true
      no_information_loss: true
    expected_behavior:
      - summary_should_mention_char_death: true
      - open_hooks_tracked: true
    failure_hints:
      character_retention: "角色死亡状态未在摘要中反映"
      hook_tracking: "神秘古剑伏笔未被追踪"

