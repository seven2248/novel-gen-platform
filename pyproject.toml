[project]
name = "novel-gen"
version = "0.1.0"
description = "4-Agent novel generation system with Story State Core"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0.0",
    "jsonschema>=4.23.0",
    "pytest>=8.3.0",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
